<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper and scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <div class="heading">
            <h1>Rock Paper and scissors</h1>
        </div>
        <div class="main">
            <div class="choices">
                <div class="choice" id="rock"> ✊ </div>
                <div class="choice" id="paper">✋</div>
                <div class="choice" id="scissors">✂️</div>
            </div>
        </div>
        <div class="score-board">
            <div class="score">
                <p id="user">0</p>
                <p>You</p>
            </div>
            <div class="score">
                 <p id="comp">0</p>
                <p>Computer</p>
            </div>
            <div class="score">
                 <p id="tie">0</p>
                <p>Tie</p>
            </div>
        </div>
        <div class="reset">
            <p>Reset Game</p>
        </div>
        <div class="msg-box">
            <p class="msg">Play Your Move</p>
        </div>
    </div>
</body>
<script src="app.js"></script>
</html>
